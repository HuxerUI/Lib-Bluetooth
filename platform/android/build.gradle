plugins {
    id "com.android.library"
}

dependencies {
    def integration = rootProject.gradle.ext
    if (integration.has("huxeruiUsesSource") && integration.huxeruiUsesSource) {
        compileOnly project(":HuxerUI")
    } else if (integration.has("huxeruiAndroidArchive")) {
        compileOnly files(integration.huxeruiAndroidArchive)
    } else {
        def sdkHome = providers.gradleProperty("huxeruiHome").orElse(providers.environmentVariable("HUXERUI_HOME")).orNull
        def archive = sdkHome ? file("${sdkHome}/share/huxerui/platform/android/HuxerUI.aar") : null
        if (archive == null || !archive.isFile()) {
            throw new GradleException("Set HUXERUI_HOME or huxeruiHome to an SDK with the Android package.")
        }
        compileOnly files(archive)
    }
}

android {
    namespace = "org.huxerui.lib.bluetooth"
    compileSdk = 36

    defaultConfig {
        minSdk = 23
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
}
